<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ラップデッキ 共有画像</title>
<style>
/* LINE などで URL を送ったときに出る絵（1200×630）。Chrome で写して ../og.png にする（写し方は 素材.md の「まとめて貼る」）。
   本体と同じ色・字・部品：黒地に黄緑、ビート・原曲・声のみの札、レコード、入りの数え。字と主役は端から 60px 以上内側 */
:root {
  --bg: #0b0b0f; --panel: #16161d; --panel2: #20202a; --line: #2c2c38;
  --text: #f3f3f6; --dim: #8a8a99;
  --accent: #d6ff3d; --accent-ink: #11140a; --voice: #ff4f8b; --orig: #7fb6ff; --entry: #ffc23d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; color: var(--text); line-break: strict;
  font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: radial-gradient(90% 120% at 82% 50%, #1a1c14 0%, var(--bg) 60%); }
.card { position: relative; width: 1200px; height: 630px; }

/* 左：名前と一言 */
.copy { position: absolute; left: 84px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
.mark { display: flex; align-items: center; gap: 20px; font-size: 76px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
.mark i { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 30px var(--accent); }
.lead { margin: 36px 0 0; font-size: 44px; white-space: nowrap; font-weight: 800; line-height: 1.3; }
.lead em { font-style: normal; color: var(--entry); }
.sub { margin: 18px 0 0; font-size: 23px; white-space: nowrap; font-weight: 600; line-height: 1.6; color: var(--dim); }
.chips { display: flex; gap: 12px; margin-top: 34px; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; padding: 8px 18px 8px 14px; border-radius: 999px;
  background: var(--panel2); box-shadow: inset 0 0 0 2.5px var(--c); }
.chip svg { width: 26px; height: 26px; fill: none; stroke: var(--c); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* 右：レコードと入りの数え */
.disc { position: absolute; left: 690px; top: 105px; width: 420px; height: 420px; border-radius: 50%;
  background: repeating-radial-gradient(circle, #111 0 2px, #17171d 2px 4px), #111;
  box-shadow: 0 0 0 10px #1c1c24, 0 20px 60px rgba(0, 0, 0, .7); }
.disc .tick { position: absolute; left: 50%; top: 4%; width: 5px; height: 22%; margin-left: -2.5px; background: var(--accent); border-radius: 3px; }
.disc .label { position: absolute; inset: 31%; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; }
.count { position: absolute; left: 630px; top: 395px; width: 150px; height: 150px; border-radius: 32px; background: var(--panel);
  box-shadow: inset 0 0 0 2px var(--line), 0 16px 40px rgba(0, 0, 0, .6);
  display: flex; flex-direction: column; align-items: center; justify-content: center; }
.count b { font-size: 96px; font-weight: 900; line-height: 1; color: var(--entry); }
.count small { font-size: 18px; font-weight: 700; color: var(--dim); margin-top: 2px; }
</style>
</head>
<body>
<div class="card">
  <div class="copy">
    <div class="mark"><i></i>ラップデッキ</div>
    <p class="lead">入りの前に、<em>4・3・2・1</em>。</p>
    <p class="sub">ラップが始まる所を、数えて教えるビートプレイヤー。<br>レコードをこすってスクラッチも。</p>
    <div class="chips">
      <span class="chip" style="--c: var(--accent)"><svg viewBox="0 0 24 24"><path d="m2 2 8 8" /><path d="m22 2-8 8" /><ellipse cx="12" cy="9" rx="10" ry="5" /><path d="M7 13.4v7.9" /><path d="M12 14v8" /><path d="M17 13.4v7.9" /><path d="M2 9v8a10 5 0 0 0 20 0V9" /></svg>ビート</span>
      <span class="chip" style="--c: var(--orig)"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>原曲</span>
      <span class="chip" style="--c: var(--voice)"><svg viewBox="0 0 24 24"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12" /><path d="M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5" /><circle cx="16" cy="7" r="5" /></svg>声のみ</span>
    </div>
  </div>
  <div class="disc"><div class="tick"></div><div class="label">ラップデッキ</div></div>
  <div class="count"><b>3</b><small>入りまで</small></div>
</div>
</body>
</html>
